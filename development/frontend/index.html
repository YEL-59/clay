    <script>
      (function (d) {
        d.classList.add('js');
        try {
          if (!/[?&]record\b/.test(location.search)) {
            var a = JSON.parse(localStorage.getItem('raye:admin:v1') || 'null');
            if (a && a.theme) d.dataset.theme = a.theme;
          }
        } catch (e) {}
        setTimeout(function () {
          d.classList.add('failsafe');
        }, 4000);
      })(document.documentElement);
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
